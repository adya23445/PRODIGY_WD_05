<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Weather App</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="weather-app">

        <h1>🌤️ Weather App</h1>

        <p class="subtitle">
            Check the current weather of any city
        </p>

        <!-- Search Box -->
        <div class="search-box">

            <input
                type="text"
                id="cityInput"
                placeholder="Enter city name..."
            >

            <button id="searchBtn">
                Search
            </button>

        </div>

        <!-- Location Button -->
        <button id="locationBtn" class="location-btn">
            📍 Use My Location
        </button>

        <!-- Loading -->
        <p id="loading">Loading...</p>

        <!-- Error -->
        <p id="error"></p>

        <!-- Weather Card -->
        <div class="weather-card" id="weatherCard">

            <div class="location">
                <h2 id="cityName">City</h2>
                <p id="date">Date</p>
            </div>

            <div class="weather-main">

                <div class="weather-icon" id="weatherIcon">
                    ☀️
                </div>

                <div>
                    <h3 id="temperature">--°C</h3>
                    <p id="condition">Weather Condition</p>
                </div>

            </div>

            <div class="weather-details">

                <div class="detail">
                    <span>💧</span>
                    <p>Humidity</p>
                    <strong id="humidity">--%</strong>
                </div>

                <div class="detail">
                    <span>💨</span>
                    <p>Wind Speed</p>
                    <strong id="wind">-- km/h</strong>
                </div>

                <div class="detail">
                    <span>🌡️</span>
                    <p>Feels Like</p>
                    <strong id="feels">--°C</strong>
                </div>

            </div>

        </div>

        <footer>
            <p>Weather App | Task-05</p>
        </footer>

    </div>

    <script src="script.js"></script>

</body>

</html>
